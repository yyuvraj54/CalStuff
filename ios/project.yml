name: CalStuff
options:
  bundleIdPrefix: com.dusht.calstuff
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO # Gradle invocation in the build-phase script needs full FS/network access.

packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIniOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  CalStuff:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CalStuff
      - path: CalStuffLogin
    info:
      path: CalStuff/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        # Firebase Phone Auth's reCAPTCHA-fallback verification flow calls
        # `fatalError` if this scheme isn't registered (see PhoneAuthProvider.swift's
        # `callbackScheme` computed property in the Firebase iOS SDK). Since the current
        # GoogleService-Info.plist has no CLIENT_ID/REVERSED_CLIENT_ID (Google Sign-In not
        # fully configured yet — see docs/FIREBASE_SETUP.md §3.3), Firebase falls back to
        # "app-<GOOGLE_APP_ID, colons -> dashes>". Update this if GOOGLE_APP_ID ever changes,
        # or replace with REVERSED_CLIENT_ID once Google Sign-In is wired up (that scheme
        # covers both flows).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-967570727168-ios-c20c6f12a174e8205253e5
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusht.calstuff.ios
        # No AppIcon set yet — explicitly blank so Xcode doesn't require one to build.
        # TODO: add an AppIcon set to Assets.xcassets and restore this once a real icon exists
        # (see app/src/main/res/mipmap-*/ic_launcher.png on Android for the source art).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # CalStuffShared is a *static* Kotlin/Native framework (isStatic = true in
        # shared/build.gradle.kts): it gets statically linked into the app binary, not copied
        # into an "Embed Frameworks" phase (that's for dynamic frameworks only — copying a
        # static one there makes installd choke trying to load it as a dylib). So: just point
        # the linker at wherever Gradle puts each variant, per SDK/config combination.
        OTHER_LDFLAGS: ["-framework", "CalStuffShared"]
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*][config=Debug]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*][config=Release]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*][config=Debug]": "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*][config=Release]": "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
    dependencies:
      - package: FirebaseiOS
        product: FirebaseCore
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseAnalytics
      - package: FirebaseiOS
        product: FirebaseFirestore
      - package: GoogleSignIniOS
        product: GoogleSignIn
    preBuildScripts:
      # NOTE: intentionally NOT using the Kotlin Gradle Plugin's built-in
      # `embedAndSignAppleFrameworkForXcode` task. That task is for *dynamic* frameworks
      # (copy into "Embed Frameworks" + codesign); CalStuffShared is *static*
      # (isStatic = true in shared/build.gradle.kts), so it needs to be statically linked
      # instead — see OTHER_LDFLAGS / FRAMEWORK_SEARCH_PATHS above. This script's only job is
      # to make sure the right Gradle-built variant exists before Xcode links against it.
      - name: "Build CalStuffShared.framework (Kotlin/Native)"
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."

          case "$PLATFORM_NAME" in
            iphonesimulator) TARGET_CAP="IosSimulatorArm64" ;;
            iphoneos) TARGET_CAP="IosArm64" ;;
            *)
              echo "error: unsupported PLATFORM_NAME '$PLATFORM_NAME' for CalStuffShared.framework"
              exit 1
              ;;
          esac

          if [ "$ARCHS" != "arm64" ]; then
            echo "error: CalStuffShared only builds for arm64 (got ARCHS='$ARCHS') — the Intel simulator (x86_64) target isn't configured in shared/build.gradle.kts. Build against an Apple Silicon simulator or device."
            exit 1
          fi

          case "$CONFIGURATION" in
            Debug|Release) ;;
            *)
              echo "error: unsupported CONFIGURATION '$CONFIGURATION'"
              exit 1
              ;;
          esac

          ./gradlew ":shared:link${CONFIGURATION}Framework${TARGET_CAP}"
        basedOnDependencyAnalysis: false
